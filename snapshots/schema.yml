version: 2

snapshots:
  - name: snap_users
    description: 
      Snapshot of the Pipedrive users table tracking historical changes to user records.
      A new version is created whenever name or email changes (scd2). Deleted users are invalidated
      rather than removed, preserving full history.
    columns:
      - name: dbt_scd_id
        description: "Unique identifier for each version of a user record. Generated by dbt snapshot."
        tests:
          - unique
          - not_null
      - name: id
        description: "Unique identifier of the user in Pipedrive."
        tests:
          - not_null
      - name: user_name
        description: "Full name of the user. Changes to this field trigger a new snapshot version."
        tests:
          - not_null
      - name: email
        description: "Email address of the user. Changes to this field trigger a new snapshot version."
        tests:
          - not_null
      - name: modified
        description: "Timestamp of the last modification of the user record in the source system."
        tests:
          - not_null
      - name: dbt_valid_from
        description: "Timestamp when this version of the user record became active."
        tests:
          - not_null
      - name: dbt_valid_to
        description: "Timestamp when this version of the user record was superseded. 
                      Null if this is the current version."

