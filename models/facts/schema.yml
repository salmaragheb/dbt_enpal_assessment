version: 2

models:
  - name: fct_activity
    description: 
      Fact table representing all sales activities logged in Pipedrive. Each row is a
      discrete sales interaction linked to a deal and a user. Incrementally loaded using
      an append strategy to capture new activities and add them to existing ones
      (e.g. a completed activity flipping from done = false to done = true).
    columns:
      - name: activity_id
        description: "Identifier of the activity."
        tests:
          - not_null
      - name: deal_id
        description: "ID of the deal this activity is linked to."
        tests:
          - not_null
      - name: assigned_to_user
        description: "ID of the user assigned to this activity."
        tests:
          - not_null
      - name: activity_type_id
        description: "Unique identifier of the activity type. Foreign key to stg_activity_types."
        tests:
          - not_null
      - name: activity_type_name
        description: "Human-readable name of the activity type (e.g. Sales Call 1, Sales Call 2)."
        tests:
          - not_null
      - name: activity_type_key
        description: "Internal slug identifying the activity type (e.g. meeting, sc_2)."
        tests:
          - not_null
      - name: is_activity_type_active
        description: "Indicates whether the activity type is currently active in Pipedrive."
        tests:
          - not_null
      - name: done
        description: "Indicates whether the activity has been completed."
        tests:
          - not_null
      - name: due_to
        description: "Timestamp when the activity is due or was completed. Used as the incremental filter column."
        tests:
          - not_null

  - name: fct_deal_changes
    description: >
      Fact table representing the complete event log of all field changes on Pipedrive deals.
      Each row is an immutable business event capturing a single field mutation on a deal
      at a point in time. Enriched with human-readable labels for stage, lost reason, and
      user lookups. Incrementally loaded using append strategy since deal change events
      are immutable once recorded. Source of truth for deal lifecycle history and
      stage transition analysis.
    columns:
      - name: deal_id
        description: "Identifier of the deal that was changed."
        tests:
          - not_null
      - name: change_time
        description: "Timestamp when the field change occurred. Used as the incremental filter column."
        tests:
          - not_null
      - name: changed_field_key
        description: "Key identifying which field was changed (e.g. stage_id, user_id, lost_reason, add_time)."
        tests:
          - not_null
      - name: new_value
        description: "Raw new value of the changed field. Contains stage_id, user_id, 
                      lost_reason_id, or timestamp depending on changed_field_key."
        tests:
          - not_null
      - name: stage_name
        description: "Resolved stage name from stg_stages. Populated only when 
                      changed_field_key = 'stage_id', null otherwise."
      - name: lost_reason_label
        description: "Resolved lost reason label from int_lost_reasons. 
                      Populated only when changed_field_key = 'lost_reason', null otherwise."
      - name: user_name
        description: "Resolved user name from dim_users_latest. 
                      Populated only when changed_field_key = 'user_id', null otherwise."