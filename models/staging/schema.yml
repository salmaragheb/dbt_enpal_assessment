version: 2

models:
  - name: stg_activity_types
    description: 
      Staging model for Pipedrive activity types. Clean 1-1 representation of the source
      table with renamed columns. Reference table mapping internal activity type slugs
      to human-readable names.
    columns:
      - name: activity_type_id
        description: "Unique identifier of the activity type."
        tests:
          - unique
          - not_null
      - name: activity_type_name
        description: "Human-readable name of the activity type (e.g. Sales Call 1, Sales Call 2)."
        tests:
          - not_null
      - name: activity_type_key
        description: "Internal slug used to identify the activity type in the activity table (e.g. meeting, sc_2)."
        tests:
          - unique
          - not_null
      - name: is_active
        description: "Indicates whether the activity type is currently active in Pipedrive."
        tests:
          - not_null

  - name: stg_activity
    description: 
      Staging model for Pipedrive activities. Clean 1-1 representation of the source
      table. Each row represents a single sales activity linked to a deal.
    columns:
      - name: activity_id
        description: "Unique identifier of the activity."
        tests:
          - not_null
      - name: activity_type_key
        description: "Internal slug identifying the activity type. Foreign key to stg_activity_types."
        tests:
          - not_null
      - name: assigned_to_user
        description: "ID of the user assigned to this activity."
        tests:
          - not_null
      - name: deal_id
        description: "ID of the deal this activity is linked to."
        tests:
          - not_null
      - name: done
        description: "Indicates whether the activity has been completed."
        tests:
          - not_null
      - name: due_to
        description: "Timestamp when the activity is due or was completed."
        tests:
          - not_null

  - name: stg_stages
    description: 
      Staging model for Pipedrive pipeline stages. Clean 1-1 representation of the source
      table. Reference table mapping stage IDs to their human-readable names, representing
      the ordered steps a deal moves through in the sales pipeline.
    columns:
      - name: stage_id
        description: "Unique identifier of the pipeline stage."
        tests:
          - unique
          - not_null
      - name: stage_name
        description: "Human-readable name of the pipeline stage (e.g. Lead Generation, Qualified Lead)."
        tests:
          - not_null
