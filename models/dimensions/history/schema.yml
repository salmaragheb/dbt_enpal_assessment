version: 2

models:
  - name: dim_users
    description: 
      Historical dimension table tracking all versions of Pipedrive users over time.
      Each row represents a single version of a user record. Multiple rows per user
      exist when name or email has changed. Built from the snap_users snapshot.
    columns:
      - name: user_id
        description: "Unique identifier of the user in Pipedrive."
        tests:
          - not_null
      - name: user_name
        description: "Full name of the user. Changes to this field trigger a new version."
        tests:
          - not_null
      - name: email
        description: "Email address of the user. Changes to this field trigger a new version."
        tests:
          - not_null
      - name: modified
        description: "Timestamp of the last modification of the user record in the source system."
        tests:
          - not_null

      - name: dbt_valid_from
        description: "Timestamp when this version of the user record became active."
        tests:
          - not_null
      - name: dbt_valid_to
        description: "Timestamp when this version of the user record was superseded. 
                      Null if this is the current version."
      - name: is_current
        description: "True if this is the latest active version of the user record."
        tests:
          - not_null
      - name: dbt_scd_id
        description: "Unique identifier for each version of a user record - generated by dbt snapshot"
        tests:
          - not_null
          - unique